<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇直测</title>
<style>body{font-family:sans-serif;margin:0;background:#f0fdf4}</style>
</head>
<body>
<div id="st">加载中…</div>
<script src="kugua-compiler.js"></script>
<script>
// ===== 沙箱全局（与 index.html 一致）=====
window.文档 = document;
window.窗口 = window;
window.本地存储 = localStorage;
window.会话存储 = sessionStorage;
window.数学 = Math;
window.日期 = Date;
window.历史 = history;
window.控制台 = console;
window.屏幕 = screen;
window.定位 = location;
window.弹窗 = function(msg){ console.log('[弹窗]'+msg); };
window.询问 = function(msg){ console.log('[输入]'+msg); return '1'; };
window.确认 = function(msg){ console.log('[确认]'+msg); return true; };
window.写入 = function(msg){ document.write(msg); };
window.随机数字 = Math.random;
window.向下取整 = Math.floor;
window.向上取整 = Math.ceil;
window.绝对值 = Math.abs;
window.转整数 = parseInt;
window.转数字 = parseFloat;
window.startLoop = setInterval;
window.stopLoop = clearInterval;
window.setT = setTimeout;
window.clearT = clearTimeout;
window.创建对象 = function(){ return {}; };
document.获取元素按id = document.getElementById;
document.获取元素按标签 = document.getElementsByTagName;
document.获取元素按类名 = document.getElementsByClassName;
document.创建元素 = document.createElement;
document.创建文本节点 = document.createTextNode;
document.获取元素按选择器 = document.querySelector;
document.获取所有元素按选择器 = document.querySelectorAll;
document.身体 = document.body;
document.主体 = document.body;
document.头部 = document.head;
document.标题 = document.title;
var ElProto = Element.prototype;
ElProto.设置文本 = function(t){ this.textContent = t; return this; };
ElProto.设置HTML = function(h){ this.innerHTML = h; return this; };
ElProto.获取文本 = function(){ return this.textContent; };
ElProto.获取HTML = function(){ return this.innerHTML; };
ElProto.添加事件监听 = function(type, fn){ this.addEventListener(type, fn); return this; };
ElProto.移除事件监听 = function(type, fn){ this.removeEventListener(type, fn); return this; };
ElProto.追加子节点 = function(c){ this.appendChild(c); return this; };
ElProto.移除子节点 = function(c){ this.removeChild(c); return this; };
ElProto.设置样式 = function(k, v){ this.style[k] = v; return this; };
ElProto.获取样式 = function(k){ return this.style[k]; };
ElProto.设置属性 = function(k, v){ this.setAttribute(k, v); return this; };
ElProto.获取属性 = function(k){ return this.getAttribute(k); };
window.添加事件监听 = function(type, fn){ this.addEventListener(type, fn); return this; };
window.移除事件监听 = function(type, fn){ this.removeEventListener(type, fn); return this; };
if (typeof KeyboardEvent !== 'undefined') {
    Object.defineProperty(KeyboardEvent.prototype, '键', { get: function(){ return this.key; }, configurable: true });
}

// ===== 编译并运行 =====
fetch('/file?path=贪吃蛇.ks').then(r => r.json()).then(res => {
    const src = res.content;
    const js = new KuguaCompiler().compile(src);
    try {
        new Function('console', js)(console);
        document.getElementById('st').textContent = '运行完成，无编译/运行错误';
        document.getElementById('st').style.color = '#047857';
    } catch (e) {
        document.getElementById('st').textContent = '运行错误: ' + e.message;
        document.getElementById('st').style.color = '#dc2626';
    }
}).catch(e => {
    document.getElementById('st').textContent = '加载失败: ' + e.message;
    document.getElementById('st').style.color = '#dc2626';
});
</script>
</body>
</html>
