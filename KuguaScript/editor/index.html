<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苦瓜脚本语言编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .editor-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
        }

        .panel-actions {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-compile {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-compile:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-run {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-clear {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .file-selector {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-selector:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .file-selector:focus {
            outline: none;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .file-selector option {
            background: #1a1a2e;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 15px;
            color: transparent;
            caret-color: #fff;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            position: relative;
            z-index: 1;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        textarea::-webkit-scrollbar {
            display: none;
        }

        textarea:focus {
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .output-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .output-title {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
        }

        .output-content {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #00ff88;
        }

        .output-content.error {
            color: #ff4444;
        }

        .syntax-highlight {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
            overflow: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .syntax-highlight::-webkit-scrollbar {
            display: none;
        }

        .keyword {
            color: #c678dd;
            font-weight: bold;
        }

        .string {
            color: #98c379;
        }

        .number {
            color: #d19a66;
        }

        .boolean {
            color: #e5c07b;
        }

        .null {
            color: #6a9955;
        }

        .comment {
            color: #5c6370;
            font-style: italic;
        }

        .punctuation {
            color: #56b6c2;
        }

        .identifier {
            color: #e06c75;
        }

        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
            display: none;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            color: #aaa;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-item span {
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>苦瓜脚本语言编辑器</h1>
        
        <div class="editor-wrapper">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">源代码</div>
                    <div class="panel-actions">
                        <select id="fileSelector" onchange="loadFile()" class="file-selector">
                            <option value="">选择文件...</option>
                        </select>
                        <button class="btn-compile" onclick="compileCode()">编译</button>
                        <button class="btn-run" onclick="runCode()">运行</button>
                        <button class="btn-clear" onclick="clearAll()">清空</button>
                    </div>
                </div>
                <div style="position: relative; height: 400px; border-radius: 8px; overflow: hidden;">
                    <div class="syntax-highlight" id="highlight"></div>
                    <textarea id="source" oninput="updateHighlight()" placeholder="在此输入苦瓜脚本代码..."></textarea>
                </div>
                <div class="status-bar">
                    <div class="status-item">行数: <span id="lineCount">1</span></div>
                    <div class="status-item">列数: <span id="columnCount">1</span></div>
                </div>
            </div>
            
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">编译结果</div>
                </div>
                <textarea id="compiled" readonly placeholder="编译后的JavaScript代码将显示在这里..."></textarea>
            </div>
        </div>
        
        <div class="output-panel">
            <div class="output-header">
                <div class="output-title">运行输出</div>
            </div>
            <div class="output-content" id="output">等待运行...</div>
        </div>
        
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const keywords = [
            '如果', '否则', '否则如果', '是', '不是', '等于', '小于', '大于',
            '小于等于', '大于等于', '不大于', '不小于', '结果是', '输入',
            '重复', '循环', '结束', '返回', '说', '定义', '类', '之',
            '的', '第', '个', '项', '长度', '功能', '方法', '全新',
            '正确', '真', '对', '错误', '错', '不对', '空', '没了',
            '并且', '或者', '就', '一直', '执行', '次', '开始于', '到',
            '为止', '每次', '增加', '追加', '去除', '包含', '等价于',
            '若', '为', '则', '和', '与', '或', '非', '用', '以', '可',
            '使', '让', '被', '把', '将', '给', '向', '从', '在', '上',
            '下', '左', '右', '前', '后', '中', '内', '外', '间', '时',
            '间', '的话', '而已', '而已矣', '罢了', '罢了罢了'
        ];

        const booleans = ['正确', '正确的', '真', '真的', '对', '对的', '错误', '错误的', '错', '错的', '不对', '不对的'];
        const nulls = ['空', '空的', '没了'];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateHighlight() {
            const source = document.getElementById('source').value;
            const highlight = document.getElementById('highlight');
            
            let result = '';
            let i = 0;
            
            while (i < source.length) {
                const char = source[i];
                
                if (char === '/') {
                    if (source[i + 1] === '/') {
                        const end = source.indexOf('\n', i);
                        const comment = end === -1 ? source.substring(i) : source.substring(i, end);
                        result += '<span class="comment">' + escapeHtml(comment) + '</span>';
                        i = end === -1 ? source.length : end;
                        continue;
                    } else if (source[i + 1] === '*') {
                        const end = source.indexOf('*/', i);
                        const comment = end === -1 ? source.substring(i) : source.substring(i, end + 2);
                        result += '<span class="comment">' + escapeHtml(comment) + '</span>';
                        i = end === -1 ? source.length : end + 2;
                        continue;
                    }
                }
                
                if (char === '“' || char === '【') {
                    const endChar = char === '“' ? '”' : '】';
                    let end = i + 1;
                    while (end < source.length && source[end] !== endChar) {
                        if (source[end] === '\\') end++;
                        end++;
                    }
                    const str = source.substring(i, end + 1);
                    result += '<span class="string">' + escapeHtml(str) + '</span>';
                    i = end + 1;
                    continue;
                }
                
                if (/[\u4e00-\u9fa5a-zA-Z_]/.test(char)) {
                    let j = i;
                    while (j < source.length && /[\u4e00-\u9fa5a-zA-Z0-9_]/.test(source[j])) {
                        j++;
                    }
                    const word = source.substring(i, j);
                    
                    if (keywords.includes(word)) {
                        result += '<span class="keyword">' + escapeHtml(word) + '</span>';
                    } else if (booleans.includes(word)) {
                        result += '<span class="boolean">' + escapeHtml(word) + '</span>';
                    } else if (nulls.includes(word)) {
                        result += '<span class="null">' + escapeHtml(word) + '</span>';
                    } else {
                        result += '<span class="identifier">' + escapeHtml(word) + '</span>';
                    }
                    i = j;
                    continue;
                }
                
                if (/[0-9]/.test(char)) {
                    let j = i;
                    while (j < source.length && (/[0-9.]/.test(source[j]))) {
                        j++;
                    }
                    const num = source.substring(i, j);
                    result += '<span class="number">' + escapeHtml(num) + '</span>';
                    i = j;
                    continue;
                }
                
                if ('。，、：；（）【】《》？！…—'.includes(char)) {
                    result += '<span class="punctuation">' + escapeHtml(char) + '</span>';
                } else {
                    result += escapeHtml(char);
                }
                i++;
            }
            
            highlight.innerHTML = result;
            
            updateStatus();
        }

        function updateStatus() {
            const source = document.getElementById('source').value;
            const lines = source.split('\n');
            const lineCount = lines.length;
            
            const textarea = document.getElementById('source');
            const cursorPos = textarea.selectionStart;
            const beforeCursor = source.substring(0, cursorPos);
            const currentLine = beforeCursor.split('\n').length;
            const currentColumn = beforeCursor.length - beforeCursor.lastIndexOf('\n');
            
            document.getElementById('lineCount').textContent = lineCount;
            document.getElementById('columnCount').textContent = currentColumn;
        }

        async function compileCode() {
            const source = document.getElementById('source').value;
            const output = document.getElementById('output');
            const compiled = document.getElementById('compiled');
            
            output.textContent = '正在编译...';
            output.className = 'output-content';
            
            try {
                const response = await fetch('/compile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ source: source })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    output.textContent = result.error;
                    output.className = 'output-content error';
                    compiled.value = '';
                } else {
                    compiled.value = result.code;
                    output.textContent = '编译成功！';
                }
            } catch (error) {
                output.textContent = '编译失败: ' + error.message;
                output.className = 'output-content error';
            }
        }

        async function runCode() {
            const source = document.getElementById('source').value;
            const output = document.getElementById('output');
            
            output.textContent = '正在运行...';
            output.className = 'output-content';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ source: source })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    output.textContent = result.error;
                    output.className = 'output-content error';
                } else {
                    output.textContent = result.output || '(无输出)';
                }
            } catch (error) {
                output.textContent = '运行失败: ' + error.message;
                output.className = 'output-content error';
            }
        }

        function clearAll() {
            document.getElementById('source').value = '';
            document.getElementById('compiled').value = '';
            document.getElementById('output').textContent = '等待运行...';
            document.getElementById('output').className = 'output-content';
            updateHighlight();
        }

        document.getElementById('source').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        document.getElementById('source').addEventListener('scroll', function() {
            const highlight = document.getElementById('highlight');
            highlight.scrollTop = this.scrollTop;
            highlight.scrollLeft = this.scrollLeft;
        });

        document.getElementById('source').addEventListener('click', updateStatus);
        document.getElementById('source').addEventListener('keyup', updateStatus);

        async function loadFiles() {
            try {
                const response = await fetch('/files');
                const files = await response.json();
                const selector = document.getElementById('fileSelector');
                selector.innerHTML = '<option value="">选择文件...</option>';
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.name;
                    option.textContent = file.name;
                    selector.appendChild(option);
                });
            } catch (error) {
                console.error('加载文件列表失败:', error);
            }
        }

        async function loadFile() {
            const selector = document.getElementById('fileSelector');
            const fileName = selector.value;
            if (!fileName) return;
            
            try {
                const response = await fetch(`/file?name=${encodeURIComponent(fileName)}`);
                const result = await response.json();
                if (result.error) {
                    alert(result.error);
                    return;
                }
                document.getElementById('source').value = result.content;
                updateHighlight();
                document.getElementById('compiled').value = '';
                document.getElementById('output').textContent = '等待运行...';
                document.getElementById('output').className = 'output-content';
            } catch (error) {
                alert('加载文件失败: ' + error.message);
            }
        }

        const sampleCode = `// 苦瓜脚本示例
数：1。
字符串：“你好，世界！”。

如果（数 小于 10）：
    说（字符串）。
否则：
    说（“数太大了”）。

重复（开始于i=0，到i小于5为止，每次i++）：
    说（i）。

数学：
    加法：输入“a”、“b”；
        结果是a + b。
    
说（数学之加法（3，5））。`;

        document.getElementById('source').value = sampleCode;
        updateHighlight();
        loadFiles();
    </script>
</body>
</html>
